[pytest]

testpaths = tests

pythonpath = .

asyncio_mode = auto

asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::DeprecationWarning
    ignore::DeprecationWarning:aiosqlite

# ============================================================
# Parallel Testing Configuration (pytest-xdist)
# ============================================================
# Number of workers for parallel execution (use -n auto for auto-detect)
# Example: pytest -n auto
# Or specify: pytest -n 4
# workers = auto

# ============================================================
# Test Markers (按角色/模块/速度分类)
# ============================================================
markers =
    # 按角色分类
    auth: 认证与授权相关测试
    shipper: 货主端功能测试
    driver: 司机端功能测试
    dispatcher: 派单员端功能测试

    # 按模块分类
    orders: 订单流程测试
    ledger: 账本相关测试
    batch: 批量操作测试
    socket: WebSocket/Socket.IO测试

    # 按速度分类
    slow: 运行时间较长的测试（>2s）
    fast: 快速测试（<200ms）
    unit: 单元测试（无外部依赖）
    integration: 集成测试（涉及多模块）

    # 特殊标记
    smoke: 冒烟测试（核心功能验证）
    regression: 回归测试（缺陷修复验证）

# ============================================================
# Test Output
# ============================================================
addopts =
    --strict-markers
    --tb=short
    -ra
    --capture=no

# ============================================================
# Coverage (when running with --cov)
# ============================================================
[coverage:run]
branch = True
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = True
