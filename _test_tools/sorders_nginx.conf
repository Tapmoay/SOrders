server {
    if ($host = sorders.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sorders.top www.sorders.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sorders.top www.sorders.top;
    ssl_certificate /etc/letsencrypt/live/sorders.top-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sorders.top-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Web 版已下线（2026-09-04）；此站点现为纯 API/Socket 入口（Android 客户端使用）

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
    }
}
