# SOrders API 的公共 location（四个 server 块共用一处，别再各抄一份）
# 服务器路径：/etc/nginx/snippets/sorders-api-locations.conf（改完记得同步回仓库）
location = /health {
    default_type text/plain;
    return 200 "ok";
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
}

location /static/uploads/ {
    # 直出磁盘，不经 uvicorn——慢客户端不再占住后端 worker
    alias /opt/SOrders/backend/uploads/;
    sendfile on;
    tcp_nopush on;
    # 安装包不缓存（版本号会变，缓存住就会一直下到旧包）
    add_header Cache-Control "no-cache";
}

location /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 短链：**永远指向最新安装包**（`publish_apk.py` 每次发布会同时写一份 `sorders-latest.apk`）。
# 为什么要它（2026-09-19）：服务端开始拒绝明文登录之后，老版本 App 的用户会卡在登录页 ——
# 而"检查更新"按钮在那个页面**够不到**（它在登录之后的「我的」页里）。
# 所以拒绝报文里直接给这条能念出来的短链：http://8.145.40.22/apk
# ⚠️ 必须留在**明文可达**（不能只在 443 块里给）：老客户端只会说明文。
location = /apk {
    return 302 /static/uploads/app/sorders-latest.apk;
}
location = /apk/ {
    return 302 /static/uploads/app/sorders-latest.apk;
}
