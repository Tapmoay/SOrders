# SOrders API 的公共 location（四个 server 块共用一处，别再各抄一份）
# 服务器路径：/etc/nginx/snippets/sorders-api-locations.conf（改完记得同步回仓库）
location = /health {
    default_type text/plain;
    return 200 "ok";
}

location /api/ {
    # ⛔ 请求体上限**必须显式写**（2026-09-24 第 22 轮 F5-1 实测）：
    #    nginx 1.20.1 的内置默认是 **1m**，而这一份 location 原来一个字都没写 →
    #    生产上 `grep -rn client_max_body_size /etc/nginx/` **0 命中**，
    #    于是「后端声明能收多少」与「nginx 真的放行多少」是两套数：
    #      · `core/upload_read.py`: 图片 4 MB / 送达照片 8 MB / 表格 8 MB
    #      · nginx 实际：1 MB，超了直接回 **413 HTML**（uvicorn 根本收不到请求）
    #    实测（打一个**不存在**的路径，证明请求到了 nginx）：
    #      1000 字节 → `404 {"detail":"Not Found"}`（能到 uvicorn）
    #      1 200 000 字节 → `413 <html>…<h1>413 Request Entity Too Large</h1>…nginx/1.20.1`
    #    受影响的正是**司机送达拍照**（长边 2560 + q85，单张常 >1 MB，且一次多张）
    #    与 AI 附件表格 —— 表现是 App 只显示「请求失败（413）」，而订单完不成、
    #    运费与账本都不生成。`deploy/nginx.example.conf` 里本来就有这一行，真实配置丢了。
    #    ⚠️ 这一行现在由 `_tools/qa/_check_upload_limits.py` 判据 ⑤ 对账（≥ 后端最宽上限）。
    client_max_body_size 32m;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host $host;
}

location /static/uploads/ {
    # 直出磁盘，不经 uvicorn——慢客户端不再占住后端 worker
    alias /opt/SOrders/backend/uploads/;
    sendfile on;
    tcp_nopush on;
    # 安装包不缓存（版本号会变，缓存住就会一直下到旧包）
    add_header Cache-Control "no-cache";
}

location /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 短链：**永远指向最新安装包**（`publish_apk.py` 每次发布会同时写一份 `sorders-latest.apk`）。
# 为什么要它（2026-09-19）：服务端开始拒绝明文登录之后，老版本 App 的用户会卡在登录页 ——
# 而"检查更新"按钮在那个页面**够不到**（它在登录之后的「我的」页里）。
# 所以拒绝报文里直接给这条能念出来的短链：http://8.145.40.22/apk
# ⚠️ 必须留在**明文可达**（不能只在 443 块里给）：老客户端只会说明文。
location = /apk {
    return 302 /static/uploads/app/sorders-latest.apk;
}
location = /apk/ {
    return 302 /static/uploads/app/sorders-latest.apk;
}
