# SOrders：80（明文，迁移期保留兼容）/ 443-IP（**TLS by IP，默认块**）/ 443-域名（待备案） / 8080（历史）
# ⚠️ sorders.top 未备案 → 阿里云按 Host/SNI 拦截 80 与 443，**域名在备案完成前不可用**；
#    所以 App 走的是 https://8.145.40.22（私有 CA 签的 IP 证书，App 侧信任该 CA）。
#    细节与换证书的两条路见 deploy/nginx/README.md。

server {
    listen 80;
    server_name sorders.top www.sorders.top 8.145.40.22;

    # Let's Encrypt 的 HTTP-01 挑战（备案完成后域名才能用；先留着）
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    include snippets/sorders-api-locations.conf;
}

server {
    # IP 直连的 TLS：App 用的就是这个。default_server = 没有/未知 SNI 时也走这里。
    listen 443 ssl default_server;
    server_name 8.145.40.22;

    ssl_certificate     /etc/nginx/ssl/sorders-ip-chain.crt;
    ssl_certificate_key /etc/nginx/ssl/sorders-ip.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include snippets/sorders-api-locations.conf;
}

server {
    # 域名 + Let's Encrypt：**现在这份证书已过期且域名被备案拦截**，
    # 保留是为了备案/续期做完之后能直接生效（见 FINDINGS 第二十二轮）。
    listen 443 ssl;
    server_name sorders.top www.sorders.top;

    ssl_certificate     /etc/letsencrypt/live/sorders.top-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorders.top-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/sorders-api-locations.conf;
}

server {
    listen 8080;
    server_name sorders.top www.sorders.top 8.145.40.22;
    include snippets/sorders-api-locations.conf;
}
