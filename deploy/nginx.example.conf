# 示例：Nginx 托管前端静态资源并反向代理 API + WebSocket（Socket.IO）
# 将 frontend/dist 构建产物放到 /var/www/sorders 或调整 root
# upstream 与 server_name 按实际域名修改

upstream sorders_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name example.com;

    # 订单附件、导出等上传（按业务调大）
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    root /var/www/sorders;
    index index.html;

    # 前端 SPA：history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API（FastAPI 挂载在 /api/v1）
    location /api/ {
        proxy_pass http://sorders_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://sorders_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Socket.IO（Engine.IO 长轮询 + WebSocket 升级）
    location /socket.io/ {
        proxy_pass http://sorders_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 上传静态文件（若由后端托管 /static/uploads）
    location /static/ {
        proxy_pass http://sorders_api;
        proxy_set_header Host $host;
    }
}
