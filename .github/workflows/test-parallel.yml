name: Tests (Parallel)

# ⚠️ 2026-09-24（整改阶段 3）：分支口径补上 p / new。
#    原来只挂 main/develop，而这个仓库的代码长期落在 p（→ origin/new）——
#    等于这份 workflow 从来没在真正的开发分支上跑过。
#    三层闸门（快闸/常闸/夜闸）见同目录 gate.yml。
on:
  push:
    branches: [main, develop, p, new]
  pull_request:
    branches: [main, develop, p, new]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Fast Tests (smoke + unit)
  # ============================================================
  test-fast:
    name: Fast Tests (smoke + unit)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-all.txt

      - name: Run fast tests (parallel)
        run: |
          cd backend
          pytest -n auto -m "fast or smoke or unit" -v --tb=short

  # ============================================================
  # Integration Tests (parallel)
  # ============================================================
  test-integration:
    name: Integration Tests (parallel)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-all.txt

      - name: Run integration tests (parallel)
        run: |
          cd backend
          pytest -n auto -m "integration and not slow" -v --tb=short

  # ============================================================
  # Slow Tests (batch, ledger sync)
  # ============================================================
  test-slow:
    name: Slow Tests (batch + ledger)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-all.txt

      - name: Run slow tests (sequential to avoid resource contention)
        run: |
          cd backend
          pytest -n 2 -m "slow or batch or ledger" -v --tb=short

  # ============================================================
  # Full Test Suite (parallel, with coverage)
  # ============================================================
  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-all.txt

      - name: Run all tests (parallel)
        run: |
          cd backend
          pytest -n auto --tb=short -v

      - name: Generate coverage report
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full
          path: backend/.pytest_cache/
          retention-days: 7

  # ============================================================
  # Role-based Test Summary
  # ============================================================
  test-role-summary:
    name: Role-based Test Summary
    runs-on: ubuntu-latest
    needs: [test-fast, test-integration]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-xdist

      - name: Run tests by role
        run: |
          cd backend
          
          echo "=== Shipper Tests ==="
          pytest -n auto -m "shipper" -v --tb=line || true
          
          echo "=== Driver Tests ==="
          pytest -n auto -m "driver" -v --tb=line || true
          
          echo "=== Dispatcher Tests ==="
          pytest -n auto -m "dispatcher" -v --tb=line || true
