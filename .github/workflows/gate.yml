# 三层闸门（整改报告 §5：CI 正式接管已有检查体系）
#
# 报告对这件事的判断是：
#   「你的质量体系非常强（92 检查 / 108 反向验证 / 970 后端用例 / 1126 安卓用例），
#     但 CI 并没有把它们真正接管 —— 你已经造好了检测器，只是没有接到自动生产线上。」
#
# 三层（报告 §5 的原图）：
#
#   Pull Request
#        ↓
#   ┌─────────────────────┐
#   │ Fast Gate < 30~60s  │  syntax / changed checks / endpoint freshness / core freeze
#   ├─────────────────────┤
#   │ Normal Gate         │  static checks / backend tests / frontend build
#   ├─────────────────────┤
#   │ Slow / Nightly      │  reverse verify / fuzz / android unit tests / production probes
#   └─────────────────────┘
#
# ⚠️ 两条诚实的说明（写在这里，免得下一个人以为它已经完美）：
#
# 1. **分支口径**：原来那份 workflow 只挂 main/develop，而这个仓库的代码长期落在 `p`（→ origin/new），
#    等于 CI 从来没跑过真正的开发分支。本文件把 p/new 一起挂上。
# 2. **安卓单测暂时放在夜闸**：本机构建用的是仓库里自带的 `_agent/gradle/gradle-8.9`，
#    而 `_agent/` 是 gitignore 的（不进仓库），runner 上要用 `setup-gradle` 现装一个 8.9。
#    第一次跑通之后再把这一步挪进 PR 闸（报告 §14 的目标是 PR 上就拦住，别停在夜闸）。
name: Gate

on:
  push:
    branches: [main, develop, p, new]
  pull_request:
    branches: [main, develop, p, new]
  schedule:
    # 夜闸：UTC 18:30 = 北京 02:30（避开白天改代码的时段）
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # 反向验证会注入 bug 再还原；两处同时跑会互相踩（本仓库实测过），所以并发上限钉成 1。
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ============================================================
  # Fast Gate：秒级～一分钟，不需要装任何依赖
  # ============================================================
  fast-gate:
    name: Fast Gate（语法 / 端点索引 / 核心冻结 / 密钥 / 迁移 / 备份）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 语法（后端全部 .py 能编译）
        run: python -m compileall -q backend/app backend/scripts

      - name: 端点索引没过期（改后端 API 必须重跑生成器）
        run: |
          cd backend
          python -m scripts.gen_endpoint_index --check --out ../docs/PROJECT_MAP/08A_ENDPOINT_INDEX.md

      - name: 核心区冻结（动核心必须先在 AI_WORK_CLAIM 里声明）
        run: python _tools/qa/_check_core_freeze.py --check

      - name: 密钥自检（仓库是公开的）
        run: python _tools/qa/_check_secrets.py --check

      - name: 迁移体系（版本表 / 命名 / 记账顺序 / 接线）
        run: python _tools/qa/_check_migrations.py --check

      - name: 备份与恢复体系（含恢复演练的隔离与门禁）
        run: python _tools/backup/_check_backup.py --check

  # ============================================================
  # Normal Gate
  # ============================================================
  static-checks:
    name: Normal Gate · 全部静态检查（清单自己算）
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # ⛔ 这一步 2026-09-25 才补上，原因值得留在这儿：
      #    在这之前**这个 job 是全仓唯一不装依赖的 job**（其它三个都装 requirements-all.txt）。
      #    后果不是"少跑几个检查"，而是 8 个检查在裸 Python 上直接 ModuleNotFoundError
      #    （sqlalchemy ×4 / socketio / PIL / PyYAML / annotated_types ×2）—— 其中`_check_ai_read_limits`
      #    和 `_check_notify_guardrails` 会退化成"扫到 0 个端点 → 判据证明不了什么"，
      #    而它们在**本机**（依赖是全局装的）全绿 —— 也就是说这类红只有 CI 看得见，
      #    而当时 CI 常年红，没人读得出"是缺依赖"还是"真缺陷"。
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      # ⚠️ 这里**故意**不写死条数：条数由脚本自己数（写死的话每加一个检查都要改 CI，
      #    而"忘了改"的表现是"少跑了一半检查但仍然是绿的"）。
      #    `_check_ci_workflows.py` 第 12 条现在会拦"跑检查的 job 却没装依赖"这件事。
      - name: 全部静态检查
        run: |
          set +e
          python _tools/qa/_check_all.py 2>&1 | tee /tmp/gate.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # ⛔ 失败时必须把**为什么**送进注解：Actions 日志要登录才看得到（匿名只看到
            #    「Sign in to view logs」），而注解匿名可读。2026-09-26 实测过一次代价：
            #    本机 119/119 全绿、CI 这个作业红，却**读不出是哪一条**（只能靠猜）。
            msg=$(grep '❌' /tmp/gate.log | head -20 | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')
            echo "::error::全部静态检查失败（退出码 $rc）：$msg"
          fi
          exit "$rc"
      # ⛔ 为什么要有这一步：Actions 的**日志要登录才看得到**（匿名只看到「Sign in to view logs」），
      #    而**注解是匿名可读的**。2026-09-26 实测过一次代价：一次「本机 119/119 全绿、CI 红」，
      #    我读不到是哪一条、也读不到为什么 —— 只能靠猜。这一步把「来源指纹对账」的**输入**
      #    （文件数 / 每个 glob 命中数 / 清单哈希 / 字节哈希 / 最近改动的 3 个文件）打成 notice，
      #    于是「本机与 CI 算出来的指纹为什么不一样」这件事变成**可读的证据**，而不是猜。
      - name: 来源指纹自检（把 CI 侧对账输入打成注解 —— 诊断用，不改任何东西）
        if: always()
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          sys.path.insert(0, '_tools/ai')
          from _airepo import GENERATED_ARTIFACTS
          root = pathlib.Path('.')
          for spec in GENERATED_ARTIFACTS:
              files = sorted({p for g in spec.sources for p in root.glob(g) if p.is_file()})
              per = ' '.join(g.split('/')[-1] + '=' + str(sum(1 for p in root.glob(g) if p.is_file()))
                             for g in spec.sources)
              h_list = hashlib.sha256('\n'.join(str(p).replace('\\', '/')
                                                     for p in files).encode()).hexdigest()[:12]
              h_bytes = hashlib.sha256(b''.join(p.read_bytes().replace(b'\r\n', b'\n')
                                                for p in files)).hexdigest()[:12]
              newest = sorted(files, key=lambda p: p.stat().st_mtime)[-3:]
              print('::notice::' + spec.key + ' files=' + str(len(files)) + ' (' + per + ') list='
                    + h_list + ' bytes=' + h_bytes + ' newest=' + ','.join(str(p) for p in newest))
          PY

  read-roles-probe:
    name: Normal Gate · AI 读权限对账（起真后端逐条打）
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      # 报告 §12：**AI 能看到什么，必须和后端真正允许什么来自同一套事实**。
      # 目录是生成的（`_gen_ai_read_catalog.py --check` 在常闸里盯着），但"生成的目录 == 真后端的行为"
      # 只有**打一遍**才知道：给多了 → AI 拿到 403（能力白写）；给少了 → 明明能查的表 AI 说查不了。
      # 两种错都不会让任何测试变红 —— 所以这条闸门必须在真后端上跑。
      - name: 起一个空库的本地后端 + 三个开发账号
        run: |
          cd backend
          export DATABASE_URL="sqlite:///./ci_probe.db"
          # ⛔ 不在这里写 JWT_SECRET_KEY：`_check_secrets.py` 会（正确地）把工作流里的密钥默认值判红。
          #    这个作业只需要一个**能跑起来的**后端，用 `Settings` 自己的缺省值就够 —— 见下面这条注释。
          # ⛔ R3-01 起「import 不再建表」：原来这一步能跑通，是因为 `import app.database`
          #    顺手执行了 DDL —— 那条副作用被**故意**摘掉了（`_check_import_purity.py` 钉着它不许回来），
          #    所以 CI 必须自己走**迁移的唯一入口**。这正是生产上的顺序：先迁移、后应用。
          if ! python -m app.migrations upgrade > /tmp/migrate.log 2>&1; then
            echo "迁移没跑通："; tail -30 /tmp/migrate.log
            echo "::error::迁移没跑通：$(tail -c 500 /tmp/migrate.log | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')"
            exit 1
          fi
          python -m scripts.seed_dev_users
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/probe-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          # ⛔ 起不来时把日志尾部**送进注解**（原因同上：日志要登录才看得到，注解不用）。
          curl -sf http://127.0.0.1:8000/health || {
            echo "后端没起来："; tail -40 /tmp/probe-api.log
            echo "::error::后端没起来：$(tail -c 600 /tmp/probe-api.log | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')"
            exit 1
          }
      - name: 逐条对账（403 = 真的不给，其余都算门通）
        env:
          # 播种脚本用的口令与探测脚本的缺省值不同，靠这个环境变量对齐（见探测脚本里的注释）。
          SORDERS_PROBE_PASSWORD: pass12345
        run: python _tools/ai/_probe_read_roles.py

  backend-tests:
    name: Normal Gate · 后端用例
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      # ⛔ 2026-09-25：**必须**带 --dist loadfile（默认的 --dist load 会在这里出错）。
      #    本测试套件是「每个 xdist worker 一个 SQLite 库」（tests/conftest.py::get_db_path），
      #    而**同一个文件的用例会共享那个库的状态** —— 默认分发把一个文件的用例拆到不同 worker 上，
      #    就有用例看不到同伴留下的行。实测：`-n auto` → 2 failed / 1013 passed；
      #    加 `--dist loadfile` → **1015 passed**。loadfile = 一个文件整体发给一个 worker，跨文件照样并行。
      #    ⚠️ 另一半仍然是老规矩：**本地**别同时开两个 pytest（同一个 master 库会互踩）。
      # ⛔⛔ 2026-09-25（第 52 轮实测后）：这里改成**顺序跑**（去掉 -n auto）。
      #    因为 `--dist loadfile` 只保证「一个文件的用例落在同一个 worker」，而一个 worker 会顺序跑
      #    好几个文件、它们**共用同一个 SQLite 库** —— 跨文件的假设照样会踩：全新检出里连跑 4 次
      #    并行跑**红了 2 次**（货主被导成「批发商」那一桶；另一次是手机号已被别的文件建过）。
      #    顺序跑连跑多轮都是 1015 passed。代价约 145s（并行 33s）—— 拿 2 分钟换确定性。
      - name: 跑全量用例
        run: |
          cd backend
          pytest -q --tb=short

  # ============================================================
  # 常闸 · 安卓端到端（报告 §14：**登录 → 导航 → 下单**）
  #
  # 为什么它必须进 CI：这三条主链此前只有"某人在本机起三台模拟器跑一遍"这一种验证方式，
  # 而报告 §14 点名的正是「App 集成测试」这一块空白。脚本本身（`_tools/e2e/`）2026-09-25
  # 第 25 轮已经跑通，缺的是**让它每次改动都被跑**。
  #
  # ⛔ 四种结局必须分得开（这就是最后那个"判定"步骤存在的理由）：
  #    · 跑通                    → 绿；
  #    · 跑挂了                  → **红**（这才是接管的意义）；
  #    · 脚本自己给出 `SKIP:` 理由 → **带理由的跳过 + `::warning::` 注解**（可见，不是静默绿）；
  #    · 连 rc 文件都没有（模拟器压根没起来）→ **红 + `::warning::` 注解**。
  #
  #    第四种在 2026-09-25 第 56 轮从"绿"改成了"红"，理由是实测出来的：第一次真跑的结果是
  #    job **success**，而日志里写着 `ProbeKVM: This user doesn't have permissions to use KVM`
  #    → 模拟器以 `-accel off` 纯软件跑了 16 分钟没启动完。**"没跑"被报成了"通过"。**
  #    ⛔ 那正是「永远绿的检查＝没有检查」。要么把环境修好（下面加了开 KVM 的步骤），
  #       要么它就该红着 —— 不许两者都不做。
  # ============================================================
  android-e2e:
    name: 常闸 · 安卓端到端（登录 → 导航 → 下单）
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      # ⛔ 这里必须绑 **0.0.0.0**（2026-09-25 第 59 轮实测改）：原来写的是「App 在模拟器里打
      #    `10.0.2.2:8000`，那是模拟器看到的宿主机 loopback，所以绑 127.0.0.1 就够」——
      #    **这句话被实测推翻了**：流程第一次真的跑到登录那一步，App 当场报
      #    `网络连接失败：Failed to connect to /10.0.2.2:8000`，
      #    而同一次体检里写着 `后端 可登录`（那是 runner 自己 curl 127.0.0.1 打通的）。
      #    两种说法都对，说的是**两个不同的网络命名空间**：runner 的 127.0.0.1 与
      #    模拟器里的 10.0.2.2 不是同一条路。绑 0.0.0.0 两边都通。
      #    判据第 19 条钉着「安卓端到端那个作业里的 uvicorn 必须绑 0.0.0.0」。
      - name: 起一个空库的本地后端 + 三个开发账号
        run: |
          cd backend
          export DATABASE_URL="sqlite:///./ci_e2e.db"
          # ⛔ R3-01 起「import 不再建表」：原来这一步能跑通，是因为 `import app.database`
          #    顺手执行了 DDL —— 那条副作用被**故意**摘掉了（`_check_import_purity.py` 钉着它不许回来），
          #    所以 CI 必须自己走**迁移的唯一入口**。这正是生产上的顺序：先迁移、后应用。
          if ! python -m app.migrations upgrade > /tmp/migrate.log 2>&1; then
            echo "迁移没跑通："; tail -30 /tmp/migrate.log
            echo "::error::迁移没跑通：$(tail -c 500 /tmp/migrate.log | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')"
            exit 1
          fi
          python -m scripts.seed_dev_users
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/e2e-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          # ⛔ 起不来时把日志尾部**送进注解**（原因同上：日志要登录才看得到，注解不用）。
          curl -sf http://127.0.0.1:8000/health || {
            echo "后端没起来："; tail -40 /tmp/e2e-api.log
            echo "::error::后端没起来：$(tail -c 600 /tmp/e2e-api.log | tr '\n' '|' | tr -d '\r' | sed 's/%/%25/g')"
            exit 1
          }
          # ⛔ 光有账号不够（2026-09-25 第 60 轮实测）：端到端的「下单」那一段要**在选品页点一行**、
          #    再**在地址库里选一条**，而 `seed_dev_users` 只造三个账号 —— 页面上写的是
          #    「暂无可用商品 ｜ 请联系派单员先在「商品管理」中添加商品后再下单」。
          #    所以这里再播一次最小数据（幂等，走真实 API，见那个脚本的 docstring）。
          #    判据第 21 条钉着这一条。
          python -m scripts.seed_ci_e2e --base http://127.0.0.1:8000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 构建 phone 包（模拟器也是手机形态，与手机包同一个 flavor）
        run: gradle -p android :app:assemblePhoneDebug --no-daemon
      # ⛔ 这一步是**前提**，不是优化。GitHub 托管 runner 上 `/dev/kvm` 存在，
      #    但当前用户不在 `kvm` 组里，`android-emulator-runner` 探测到没权限就走 `-accel off`
      #    纯软件模拟 —— 2026-09-25 第 56 轮实测：**16 分钟没启动完，`Timeout waiting for emulator to boot.`**
      #    官方 README 给的修法就是下面这条 udev 规则（`MODE="0666"` 而不是 0660 —— 因为 runner 用户不在组里）。
      - name: 开启 KVM（托管 runner 上跑模拟器的前提）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # ⛔ 这一步**允许失败**：模拟器起不来是环境问题，不是"这段代码坏了"。
      #    但"允许失败"不等于"允许静默绿" —— 判定在下一步，它按 `/tmp/e2e.rc` 把四种结局分开。
      - name: 起模拟器 + 装包 + 跑流程
        id: e2e
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # 默认 600s。头一次真跑（没有硬件加速）跑到 16 分钟都没起来，所以显式放宽；
          # 开了 KVM 之后正常是 1~3 分钟，这个值只起"慢也不冤杀"的作用。
          emulator-boot-timeout: 900
          # ⚠️ 2026-09-25 第 60 轮实测：默认 AVD 只有 2 核（这个 action 会写 `hw.cpu.ncore=2`），
          #    加上软件渲染（`swiftshader_indirect`，无头 runner 上只能这样），
          #    流程第一次真的跑到 App 启动时，屏幕上出现的是
          #    `❌ 既没看到工作台也没看到登录页。当前屏幕：Pixel Launcher isn't responding ｜ Close app ｜ Wait`
          #    —— **是 launcher 被拖到 ANR**，不是我们的 App 崩。
          #    所以显式给 4 核 / 4G（GitHub 标准 runner 是 4 vCPU / 16G，留得下）。
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -cores 4 -memory 4096
          # ⛔ **必须是一整行**：这个 action 把 `script` **按行**分别 `sh -c` 执行。
          #    2026-09-25 第 57 轮实测（日志原文）——
          #      [command]/usr/bin/sh -c set +e
          #      [command]/usr/bin/sh -c python _tools/e2e/_flow_login_nav_order.py --check-env --serial 5554 \
          #    是**两次独立调用**。后果有三，而且全部静默：
          #      ① `set +e` 管不到后面；② 变量（`rc=$?`）活不过一行；
          #      ③ 行尾 `\` 变成**一个真实参数** → argparse 直接 `unrecognized arguments: \` 退 2。
          #    所以整条流程压成一行，用 `;` / `||` 连接；判据第 16 条钉着「只能一行」。
          # ⚠️ 开头那个 `echo 9 > /tmp/e2e.rc` 是**哨兵**（2026-09-25 第 58 轮加的）：
          #    没有它，判定步骤分不出「模拟器压根没起来」（= 没有 rc 文件）与
          #    「脚本跑到了但中途挂了」（= 写 rc 那一行本身没跑成）—— 两者都是"没有 rc 文件"，
          #    第 58 轮实测就撞上了这个含混（明明是脚本退 2，报的却是"模拟器没起来"）。
          #    有哨兵后：没有文件 = 没跑；rc=9 = 跑到了但没写出结论；0/3/其他 = 脚本自己的结论。
          # ⛔ **先装包、再体检**（2026-09-25 第 58 轮实测修）：`--check-env` 体检四样 ——
          #    adb / 设备 / **App 装没装** / 后端。原来的顺序是先 `--check-env` 再 `adb install`，
          #    于是它必然报 `SKIP: emulator-5554 上没装 com.tapmoay.sorders` 并 rc=3 跳过 ——
          #    **这条端到端从落地那天（ef6854b）起就不可能真的跑过**，而它一直显示 success。
          #    判据第 18 条钉着「adb install 必须在第一次 --check-env 之前」。
          # ⛔ **装完必须预授运行时权限**（2026-09-25 第 59 轮实测）：CI 每次都是**全新安装**，
          #    登录成功之后会弹出系统定位权限弹窗，挡住工作台 ——
          #    日志原文：`❌ 登录后没进工作台。当前屏幕：Allow SOrders 派单送货 to access
          #    this device's location? ｜ Precise ｜ Approximate ｜ While using the app ｜ …`。
          #    开发机上这个权限早就被手点过了，所以本地从来不会遇到 —— 只有全新安装才会。
          #    预授的是清单里声明的四个**运行时**权限（定位两个 / 通知 / 读图），
          #    它们正好是 App 首次进工作台前后会弹的那几个。判据第 20 条钉着这一条。
          # ⚠️ 中间那个 `sleep 20` 是**让系统先安定**：装包 + 授 4 个权限之后立刻跑流程，
          #    会撞上 launcher 还在忙（第 60 轮实测就是 ANR 弹窗盖住屏幕）。
          script: >
            echo 9 > /tmp/e2e.rc; adb install -r android/app/build/outputs/apk/phone/debug/*.apk > /tmp/e2e.log 2>&1; adb shell pm grant com.tapmoay.sorders android.permission.ACCESS_FINE_LOCATION >> /tmp/e2e.log 2>&1; adb shell pm grant com.tapmoay.sorders android.permission.ACCESS_COARSE_LOCATION >> /tmp/e2e.log 2>&1; adb shell pm grant com.tapmoay.sorders android.permission.POST_NOTIFICATIONS >> /tmp/e2e.log 2>&1; adb shell pm grant com.tapmoay.sorders android.permission.READ_MEDIA_IMAGES >> /tmp/e2e.log 2>&1; sleep 20; python _tools/e2e/_flow_login_nav_order.py --check-env --serial 5554 --password pass12345 >> /tmp/e2e.log 2>&1 || { echo $? > /tmp/e2e.rc; exit 0; }; python _tools/e2e/_flow_login_nav_order.py --serial 5554 --password pass12345 >> /tmp/e2e.log 2>&1; echo $? > /tmp/e2e.rc
      - name: 判定（跑通 / 跑挂 / 带理由跳过）
        if: always()
        run: |
          if [ ! -f /tmp/e2e.rc ]; then
            echo "::warning title=安卓端到端这次没跑::这台 runner 上没能起模拟器 —— **这次没有跑**，不是通过。本地跑法见 _tools/e2e/_flow_login_nav_order.py 的用法。"
            echo "::error title=安卓端到端没跑通::连 /tmp/e2e.rc 都没有 —— 模拟器压根没起来（先看上面有没有 ProbeKVM / boot timeout）。⛔ 「没跑」不等于「通过」：省掉这一行，这个作业就只是一块永远绿的装饰牌子。"
            exit 1
          fi
          rc=$(tail -1 /tmp/e2e.rc | tr -d "[:space:]")
          cat /tmp/e2e.log || true
          if [ "$rc" = "9" ]; then
            echo "::error title=安卓端到端没跑通::rc=9 是哨兵值 —— 模拟器起来了、脚本也起了，但它**没写出结论**就退出了（看上面 /tmp/e2e.log 与脚本那一行的报错）。这与「模拟器没起来」是两回事。"
            exit 1
          fi
          if [ "$rc" = "0" ]; then echo "✅ 登录 → 导航 → 下单 → 对账 四段全通"; exit 0; fi
          if [ "$rc" = "3" ]; then
            echo "::warning title=安卓端到端带理由跳过::$(grep -m1 '^SKIP:' /tmp/e2e.log || echo '脚本没给出 SKIP 行，见上面日志')"
            exit 0
          fi
          echo "::error title=安卓端到端没跑通::rc=$rc —— 见上面日志与 _agent/e2e 里的截图"; exit 1

  # ⚠️ 2026-09-25（用户拍板）：frontend-build 作业**删掉了** —— 前端 H5（frontend/）正式归档。
  #    理由：它是三端里最初始的网页版，**没有任何部署引用**（_tools/deploy/ 与 nginx 都搜不到 frontend/dist），
  #    线上没人访问它；留着它却继续在 CI 里跑构建，就是报告 §14 说的「旧系统，但又像新系统」。
  #    归档副本在 _archive/frontend-H5-归档-20260925/（不进 git），代码本体可以从 git 历史取回。

  # ============================================================
  # Slow / Nightly Gate
  # ============================================================
  reverse-verify:
    name: Nightly · 反向验证（证明红线真的在检查）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # ⛔ 和 `static-checks` 同一天补的：反向验证脚本会去跑那些检查，
      #    没有依赖同样会成片 ModuleNotFoundError —— 而它只在夜闸跑，红了更没人看见。
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      # ⛔ 反向验证会**注入真缺陷再还原**，所以：
      #    ① 期间不能有人改源码（本仓库 AGENTS.md 写着这条）；
      #    ② 它要独占工作区 —— 这就是这个 job 与别的 job 分开的原因。
      - name: 全部反向验证（清单自己算）
        run: python _tools/ai/_reverse_verify_all.py

  # ============================================================
  # Nightly · 测试隔离度（每个测试文件单独跑）
  # ============================================================
  test-isolation:
    name: Nightly · 测试隔离度（每个文件单独跑）
    # ⚠️ 为什么要有这一条：本套件是「每个 xdist worker 一个 SQLite 库」，而**同一个文件里的用例
    #    会共享那个库的状态** —— 于是会出现两种**假绿**（既不红也不报错，只在换了执行顺序或
    #    分发方式之后才现形）。CI 上那两条工作流红了整整几轮，根子就是这两类（计划表第 42/43 轮）。
    #    这个扫描量的是「**每个文件从空库开始**还过不过」—— 也就是 `--dist loadfile` 依赖的那条不变式。
    #    ⛔ 不进 PR 闸：它要十几分钟（每个文件一次 pytest 启动 + 一次建库）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 装依赖
        run: |
          cd backend
          pip install -r requirements-all.txt
      - name: 逐个测试文件单独跑（每个文件一个空库）
        run: python _tools/qa/_sweep_test_isolation.py

  android-unit-tests:
    name: Normal Gate · 安卓单测（PR 上也拦）
    # ⚠️ 2026-09-25：**去掉 if: schedule** —— 它现在 PR 上也跑（报告 §14 的目标就是「PR 上就拦住」，
    #    而这一条一直挂在夜闸，等于没人拦）。
    #    ⛔ 为什么敢挪：① 本机把**两个 flavor** 都跑通了（`testEmuDebugUnitTest` 与 `testPhoneDebugUnitTest`
    #    各 BUILD SUCCESSFUL）；② 工具链四件事早被 `_check_ci_workflows.py` 钉住（setup-java /
    #    setup-gradle 且版本 pin 成 8.9 / flavor 真实存在 / 失败也有结论）。
    #    ⚠️ 保留 schedule 触发（没写 if 就是所有事件都跑）：这也是报告 §18 规则 4 的「双跑观察」——
    #    等 PR 上稳定跑过一段时间，再把夜闸那条重复覆盖撤掉。
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # 全量历史（若干判据要看 git log；默认只有 1 个提交会报错）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 与开发机一致（dev-build.ps1 用 _agent/gradle/gradle-8.9；那个目录 gitignore 了）
          gradle-version: "8.9"
      - name: 跑模拟器变体的单测
        run: gradle -p android :app:testPhoneDebugUnitTest --no-daemon --stacktrace
      # ⚠️ 汇总那一步调的是 `python`，而这个 job 原来**没装 Python** —— runner 上有没有 `python`
      #    （而不是 `python3`）是不保证的，而那个 `|| true` 会把「command not found」也吞掉：
      #    表现是**这一步永远绿、报告永远不出现**（一个静默失败）。装上 python 才是确定的。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 汇总测试报告（失败也要给结论，别只留一句 exit 1）
        if: always()
        run: python _tools/qa/_android_test_count.py || true

